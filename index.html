<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CARCASE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0d0f;--card:#18181c;--line:#2a2a30;--tx:#f2f2f2;--mut:#8a8a93;--ac:#e5173f;
--common:#8a8a93;--rare:#3ecf6a;--super_rare:#3b82f6;--epic:#a855f7;--mythic:#ef4444;--legendary:#f5b942}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
#app{padding:14px;max-width:520px;margin:auto}
h2{margin:6px 0 12px;font-size:20px;letter-spacing:.5px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coins{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:20px;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;width:100%;margin-top:8px}
.btn.g{background:#26262c}.btn:disabled{opacity:.4}
.m{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
.car{position:relative;border-radius:14px;padding:12px;min-height:120px;background:linear-gradient(135deg,#1d1d22,#0f0f12);border:1.5px solid var(--c);box-shadow:0 0 14px -6px var(--c);display:flex;flex-direction:column;justify-content:flex-end}
.car .mk{position:absolute;top:10px;left:12px;font-size:11px;color:var(--c);text-transform:uppercase;letter-spacing:1px}
.car b{font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111114;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:14px 0;font-size:12px}
nav button.on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov .car{width:260px;animation:pop .35s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.lights{display:flex;gap:10px;justify-content:center;margin:18px 0}
.lights i{width:34px;height:34px;border-radius:50%;background:#2a2a30}.lights i.on{background:var(--ac);box-shadow:0 0 18px var(--ac)}
.lights.go i{background:#39ff7a;box-shadow:0 0 18px #39ff7a}
.big{font-size:34px;text-align:center;font-weight:800;min-height:44px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:12px;z-index:20;display:none}
select{width:100%;background:#26262c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:6px}
#app>*{animation:fade .3s both}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.btn,.car{transition:transform .1s}.btn:active,.car:active{transform:scale(.97)}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.qa button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:16px 0;font-weight:700}
.reel{position:relative;overflow:hidden;width:100%}.strip{display:flex;will-change:transform}.it{flex:0 0 120px;margin-right:10px}.it .car{min-height:110px;padding:8px}.it b{font-size:13px}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ac);z-index:2;box-shadow:0 0 12px var(--ac)}
.rev{position:relative;text-align:center}.burst{position:absolute;left:50%;top:40%;width:440px;height:440px;margin:-220px;border-radius:50%;background:radial-gradient(var(--c),transparent 65%);opacity:.55;animation:bst .8s both}@keyframes bst{from{transform:scale(.2);opacity:0}}
.rev>*:not(.burst){position:relative}
.rw{width:100%;max-width:380px}
.trk{position:relative;height:130px;border-radius:12px;overflow:hidden;background:#141417;border:1px solid var(--line);margin:12px 0}
.road{position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,#3a3a42 0 26px,transparent 26px 52px)}.road.run{animation:rd .2s linear infinite}@keyframes rd{to{background-position-x:-52px}}
.lane{position:absolute;left:0;right:0;height:50%}.lane:nth-of-type(2){top:0}.lane:nth-of-type(3){top:50%}
.rc{position:absolute;left:6px;top:10px;width:80px;color:#888}.rc.me{color:var(--ac)}.rc svg{width:100%;fill:currentColor;filter:drop-shadow(0 0 6px currentColor)}
.fin{position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/10px 10px}
.trk.bad{border-color:var(--ac);box-shadow:0 0 20px var(--ac)}.shk{animation:shk .12s 6}@keyframes shk{50%{transform:translateX(7px)}}
</style></head><body>
<div id="toast"></div><div id="app"></div>
<nav id="nav"></nav>
<script>
const tg=window.Telegram&&Telegram.WebApp;try{tg&&(tg.ready(),tg.expand(),tg.setHeaderColor&&tg.setHeaderColor('#0d0d0f'))}catch(e){}
// ===== БАЛАНС =====
const B={maxH:10,start:500,
 inc:{common:[2,5],rare:[5,10],super_rare:[10,20],epic:[20,40],mythic:[40,80],legendary:[80,150]},
 rn:{common:'Обычная',rare:'Редкая',super_rare:'Сверхредкая',epic:'Эпик',mythic:'Мифик',legendary:'Легендарная'},
 sell:0.5,daily:[100,150,200,250,300,400,600],winCap:10,
 cases:{starter:{n:'Starter Case',p:0,o:{common:55,rare:25,super_rare:12,epic:5,mythic:2,legendary:1}},
  street:{n:'Street Case',p:400,o:{common:60,rare:26,super_rare:10,epic:3,mythic:.8,legendary:.2}},
  premium:{n:'Premium Case',p:3000,o:{common:20,rare:30,super_rare:28,epic:14,mythic:6,legendary:2}}},
 bots:{rookie:{n:'Rookie',car:'Civic EK9',pw:.8,r:40},street:{n:'Street Racer',car:'Impreza WRX STI',pw:1,r:90},pro:{n:'Pro Driver',car:'E46 M3',pw:1.2,r:200},elite:{n:'Elite',car:'Supra MK4',pw:1.45,r:450},champ:{n:'Champion',car:'911 GT3',pw:1.7,r:1000}}};
// Фото: добавьте поле img:'URL' к машине — оно подхватится автоматически
const CARS=[['VW','Golf 5 GTI',2005,'common',200,15000],['Honda','Civic EK9',1998,'common',185,14000],['BMW','E36 328i',1996,'common',193,12000],
['Toyota','Corolla AE86',1985,'common',128,11000],['Mazda','RX-7 FD',1995,'rare',255,45000],['Subaru','Impreza WRX STI',2006,'rare',300,38000],
['Mitsubishi','Lancer Evo IX',2005,'rare',280,42000],['BMW','E46 M3',2003,'super_rare',343,60000],['Audi','RS3',2017,'super_rare',400,70000],
['Nissan','Skyline R34 GT-R',1999,'epic',280,150000],['Toyota','Supra MK4',1997,'epic',330,170000],['Porsche','911 GT3',2022,'mythic',510,350000],
['Lamborghini','Huracan',2015,'mythic',610,400000],['Ferrari','F40',1987,'legendary',478,900000],['Bugatti','Chiron',2018,'legendary',1500,2500000]
].map((c,i)=>({id:i,mk:c[0],md:c[1],yr:c[2],r:c[3],hp:c[4],v:c[5]}));
const inc=c=>{const[l,h]=B.inc[c.r];return Math.round(l+(h-l)*Math.min(1,c.v/900000))};
// ===== СОСТОЯНИЕ =====
const K='carcase_v1';let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{coins:B.start,cars:[],starter:0,last:Date.now(),wins:0,losses:0,best:null,wd:'',wc:0,dd:'',ds:0,uid:1};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),cv=c=>`var(--${c})`;
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const garage=()=>S.cars.map(u=>({...CARS[u.c],u:u.u}));
const hourly=()=>garage().reduce((s,c)=>s+inc(c),0);
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n;
const user=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
function card(c){const img=c.img?`<img src="${c.img}" style="position:absolute;inset:0;width:100%;height:60%;object-fit:cover;border-radius:12px 12px 0 0;opacity:.9">`:'';
return `<div class="car" style="--c:${cv(c.r)}">${img}<span class="mk">${B.rn[c.r]}</span><div class="m">${c.mk} · ${c.yr}</div><b>${c.md}</b><div class="m">${c.hp} л.с. · ${inc(c)} CC/ч</div></div>`}
// ===== КЕЙСЫ =====
function pick(o){let t=Object.values(o).reduce((a,b)=>a+b,0),r=rnd(t);for(const k in o){if((r-=o[k])<0)return k}return'common'}
function openCase(id){const cs=B.cases[id];
 if(id==='starter'){if(S.starter)return toast('Уже открыт')}else if(S.coins<cs.p)return toast('Не хватает CC');
 if(id==='starter')S.starter=1;else S.coins-=cs.p;
 const r=pick(cs.o),pool=CARS.filter(c=>c.r===r),car=pool[Math.floor(rnd(pool.length))];
 S.cars.push({c:car.id,u:Date.now()+'-'+Math.floor(rnd(1e6))});save();
 const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);
 const WN=22,items=Array.from({length:28},(_,i)=>i===WN?car:CARS[Math.floor(rnd(CARS.length))]);
 ov.innerHTML=`<div class="reel"><div class="mark"></div><div class="strip" id="st">${items.map(c=>`<div class="it">${card(c)}</div>`).join('')}</div></div>`;
 const st=$('st'),w=st.parentElement.clientWidth;st.getBoundingClientRect();
 st.style.transition='transform 2.6s cubic-bezier(.12,.7,.1,1)';st.style.transform=`translateX(-${WN*130+60-w/2+rnd(40)-20}px)`;
 setTimeout(()=>{if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}
  ov.innerHTML=`<div class="rev"><div class="burst" style="--c:${cv(car.r)}"></div><div style="width:260px;margin:auto">${card(car)}</div><button class="btn" id="ok" style="width:260px">В гараж</button></div>`;
  $('ok').onclick=()=>{ov.remove();render()}},2900)}
// ===== ГОНКИ =====
let race=null;
const SVG='<svg viewBox="0 0 80 28"><path d="M3 21L9 13L24 8H50L65 14L77 17V22H3Z"/><circle cx="20" cy="22" r="5" stroke="#0d0d0f" stroke-width="2"/><circle cx="62" cy="22" r="5" stroke="#0d0d0f" stroke-width="2"/></svg>';
function startRace(cu,bk){const car=garage().find(c=>c.u===cu);if(!car)return;
 const bot=B.bots[bk],bcar=CARS.find(c=>c.md===bot.car),today=new Date().toDateString();
 const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="rw"><div class="m" style="text-align:center">${car.mk} ${car.md}<br>vs ${bot.n} · ${bcar.mk} ${bcar.md}</div>
 <div class="trk" id="trk"><div class="road" id="rd"></div><div class="lane"><div class="rc me" id="pc">${SVG}</div></div><div class="lane"><div class="rc" id="bc" style="color:${cv(bcar.r)}">${SVG}</div></div><div class="fin"></div></div>
 <div class="lights" id="L"><i></i><i></i><i></i></div><div class="big" id="T">Готов?</div><button class="btn" id="S">START</button><div id="res"></div></div>`;
 document.body.appendChild(ov);race={go:0,done:false,t:[]};
 const L=$('L').children,T=$('T');let i=0;
 const tick=()=>{if(i<3){L[i].classList.add('on');T.textContent=3-i;i++;race.t.push(setTimeout(tick,700))}else race.t.push(setTimeout(()=>{race.go=performance.now();$('L').classList.add('go');T.textContent='GO!'},500+rnd(2500)))};
 tick();
 $('S').onclick=()=>{if(race.done)return;race.done=true;race.t.forEach(clearTimeout);$('S').style.display='none';
  const d=race.go?performance.now()-race.go:-1,fs=d<100;
  const rs=fs?-.25:Math.max(-.2,.2-d/1750),br=180+rnd(120);
  const me=car.hp/400*(1+rs)*(.9+rnd(.2)),foe=bot.pw*(1-(br-180)/1750)*(.9+rnd(.2)),win=me>foe;
  let rw=0;if(S.wd!==today){S.wd=today;S.wc=0}
  if(win){S.wins++;if(S.wc<B.winCap){S.wc++;rw=bot.r;S.coins+=rw}}else S.losses++;
  if(!fs&&(S.best===null||d<S.best))S.best=Math.round(d);save();
  const gap=Math.min(1.2,.3+Math.abs(me-foe)*1.5),base=2.4,tp=win?base:base+gap,tb=win?base+gap:base;
  const run=(id,t)=>{const e=$(id);e.style.transition=`left ${t}s cubic-bezier(.45,0,.85,.65)`;e.style.left='calc(100% - 90px)'};
  $('rd').classList.add('run');run('bc',tb);
  if(fs){$('pc').classList.add('shk');$('trk').classList.add('bad');T.style.color='var(--ac)';T.textContent='FALSE START'}else{run('pc',tp);T.textContent=Math.round(d)+' мс'}
  setTimeout(()=>{$('rd').classList.remove('run');
   $('res').innerHTML=`<div class="big" style="color:${win?'#39ff7a':'var(--ac)'}">${fs?'ПОРАЖЕНИЕ':win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</div>
   <div class="box m">Реакция: ${fs?'—':Math.round(d)+' мс'} · бот: ${Math.round(br)} мс<br>${win?(rw?'Награда: +'+rw+' CC':'Лимит наград на сегодня исчерпан'):'Награды нет'}</div><button class="btn" id="ok">Закрыть</button>`;
   $('ok').onclick=()=>{ov.remove();render()}},Math.max(tp,tb)*1000+300)}}
// ===== ЭКРАНЫ =====
let tab='home',sort='r',sel=null;
const TABS=[['home','Главная'],['cases','Кейсы'],['garage','Гараж'],['race','Гонки'],['profile','Профиль']];
function claimable(){const h=Math.min(B.maxH,Math.max(0,(Date.now()-S.last)/3.6e6));return Math.floor(hourly()*h)}
function render(){
 $('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 const top=`<div class="top"><b>CARCASE</b><div class="coins">${S.coins.toLocaleString()} CC</div></div>`;let h='';
 if(tab==='home'){const cl=claimable(),today=new Date().toDateString();
  h=`<div class="box"><div class="m">Игрок</div><h2>${user?user.first_name:'Гонщик'}</h2><div class="m">Машин: ${S.cars.length} · Доход: ${hourly()} CC/ч</div></div>
  <div class="box"><b>Пассивный доход</b><div class="big">${cl} CC</div><div class="m">Копится до ${B.maxH} ч</div><button class="btn" ${cl?'':'disabled'} onclick="S.coins+=claimable();S.last=Date.now();save();toast('Получено');render()">Забрать</button></div>
  <div class="box"><b>Ежедневная награда</b><div class="m">Серия: ${S.ds} дн.</div><button class="btn" ${S.dd===today?'disabled':''} onclick="daily()">${S.dd===today?'Получена сегодня':'Получить'}</button></div>
  <div class="qa"><button onclick="tab='cases';render()">Кейсы</button><button onclick="tab='garage';render()">Гараж</button><button onclick="tab='race';render()">Гонки</button></div>${!S.starter?`<button class="btn" onclick="openCase('starter')">🎁 Открыть бесплатный кейс</button>`:''}`}
 if(tab==='cases')h=`<h2>Кейсы</h2>`+Object.entries(B.cases).map(([id,c])=>`<div class="box"><b>${c.n}</b> <span class="m">${c.p?c.p+' CC':id==='starter'&&S.starter?'открыт':'бесплатно'}</span>
  <div class="m" style="margin-top:6px">${Object.entries(c.o).map(([r,p])=>`<span style="color:${cv(r)}">${B.rn[r]} ${p}%</span>`).join(' · ')}</div>
  <button class="btn" ${id==='starter'&&S.starter?'disabled':''} onclick="openCase('${id}')">Открыть</button></div>`).join('');
 if(tab==='garage'){const g=garage();const ord=Object.keys(B.rn);
  g.sort((a,b)=>sort==='r'?ord.indexOf(b.r)-ord.indexOf(a.r):sort==='v'?b.v-a.v:sort==='hp'?b.hp-a.hp:inc(b)-inc(a));
  h=`<h2>Гараж</h2><div class="box m">Стоимость: ${g.reduce((s,c)=>s+c.v,0).toLocaleString()} CC · Доход: ${hourly()} CC/ч
  <select onchange="sort=this.value;render()">${[['r','По редкости'],['v','По стоимости'],['hp','По мощности'],['i','По доходу']].map(o=>`<option value="${o[0]}" ${sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`+
  (g.length?`<div class="grid">${g.map(c=>`<div onclick="sel='${c.u}';render()">${card(c)}</div>`).join('')}</div>`:`<div class="box m">Гараж пуст. Откройте стартовый кейс.</div>`);
  if(sel){const c=g.find(x=>x.u===sel);if(c)h+=`<div class="ov" onclick="if(event.target===this){sel=null;render()}"><div style="width:100%;max-width:320px">${card(c)}<div class="box m" style="margin-top:10px">Стоимость: ${c.v.toLocaleString()} CC<br>Продажа: ${Math.floor(c.v*B.sell*.01)} CC</div>
  <button class="btn g" onclick="sell('${c.u}')">Продать за ${Math.floor(c.v*B.sell*.01)} CC</button></div></div>`}}
 if(tab==='race'){const g=garage();h=`<h2>Гонки</h2>`+(g.length?`<div class="box"><div class="m">Машина</div><select id="rc">${g.map(c=>`<option value="${c.u}">${c.mk} ${c.md} (${c.hp} л.с.)</option>`).join('')}</select>
  <div class="m" style="margin-top:10px">Соперник</div><select id="rb">${Object.entries(B.bots).map(([k,b])=>`<option value="${k}">${b.n} · ${b.car} · ${b.r} CC</option>`).join('')}</select>
  <button class="btn" onclick="startRace($('rc').value,$('rb').value)">Гоняться</button><div class="m" style="margin-top:8px">Побед с наградой сегодня: ${S.wd===new Date().toDateString()?S.wc:0}/${B.winCap}</div></div>`:`<div class="box m">Нужна хотя бы одна машина.</div>`)}
 if(tab==='profile'){const g=garage();h=`<div class="box"><h2>${user?user.first_name:'Гонщик'}</h2>
  <div class="m">Машин: ${g.length}<br>Стоимость гаража: ${g.reduce((s,c)=>s+c.v,0).toLocaleString()} CC<br>Победы: ${S.wins} · Поражения: ${S.losses}<br>Лучшая реакция: ${S.best===null?'—':S.best+' мс'}</div></div>
  <button class="btn g" onclick="if(confirm('Сбросить весь прогресс?')){localStorage.removeItem('${K}');location.reload()}">Сбросить прогресс</button>`}
 $('app').innerHTML=top+h}
function daily(){const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 S.ds=S.dd===y?S.ds+1:1;const r=B.daily[(S.ds-1)%B.daily.length];S.coins+=r;S.dd=t;save();toast('+'+r+' CC');render()}
function sell(u){const i=S.cars.findIndex(x=>x.u===u);if(i<0)return;const c=CARS[S.cars[i].c];if(!confirm('Продать '+c.md+'?'))return;
 S.coins+=Math.floor(c.v*B.sell*.01);S.cars.splice(i,1);sel=null;save();render()}
render();
</script></body></html>
