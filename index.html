<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свинопад</title>
<style>
:root{--bg:#ffe3ee;--fg:#5a2438;--card:#fff8fb;--ac:#ff5c8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--fg:#ffd9e6;--card:#3b2230;--ac:#ff7aa2}}
:root[data-theme="dark"]{--bg:#2a1620;--fg:#ffd9e6;--card:#3b2230;--ac:#ff7aa2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
#hd{display:flex;gap:18px;align-items:center;justify-content:center;padding:6px 8px 2px;font-size:12px;text-align:center}
#hd b{display:block;font-size:20px}
#ev{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;padding:2px 4px}
#ev canvas{width:20px;height:20px;background:var(--card);border-radius:8px}
#w{position:relative;width:min(100vw,calc((100dvh - 130px) * .6))}
#c{width:100%;display:block;aspect-ratio:360/600;background:var(--card);border-radius:14px;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(40,10,25,.72);color:#fff;border-radius:14px;text-align:center;padding:20px}
#ov h1{margin:0;font-size:34px}#ov button+button{font-size:16px;background:rgba(255,255,255,.18)}#fp{display:none}
#ov button{font:inherit;font-size:20px;padding:12px 28px;border:0;border-radius:30px;background:var(--ac);color:#fff;font-weight:700}
#tp{font-size:12px;padding:4px;opacity:.85}
#w{width:min(100vw,calc((100dvh - 175px) * .6))}
#pn{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px calc(env(safe-area-inset-bottom,0px) + 8px)}
#pn.on{display:flex}#co2{text-align:center;font-size:20px;font-weight:700}
#tb{display:flex;flex-wrap:wrap;gap:4px}#tb button{flex:1 0 18%;font:inherit;font-size:12px;padding:8px 2px;border:0;border-radius:10px;background:var(--card);color:var(--fg)}#tb .a{background:var(--ac);color:#fff}#tb button{font-size:11px}
#bd{flex:1;overflow:auto;padding:6px 0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:2px solid transparent;border-radius:12px;background:var(--card);color:var(--fg);font:inherit}.it.s{border-color:var(--ac)}.it img{width:56px;height:56px}.it small{font-size:11px}
.cs{display:flex;width:100%;align-items:center;justify-content:space-between;gap:6px;margin:0 0 8px;padding:14px;border:0;border-radius:14px;background:var(--card);color:var(--fg);font:inherit}
#rs{padding:10px;margin-bottom:8px;border-radius:12px;background:var(--ac);color:#fff;text-align:center;font-weight:700}
#vp{position:relative;overflow:hidden;margin-top:20px;background:var(--card);border-radius:12px;padding:8px 0}#st{display:flex}.sl{flex:0 0 80px;margin:0 4px;display:flex;flex-direction:column;align-items:center;font-size:11px;text-align:center}.sl img{width:60px;height:60px}.sl span{font-size:40px;line-height:60px}#vp i{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#ff2d55}
#cl{font:inherit;padding:12px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:700}
#tray{display:flex;gap:6px;min-height:36px;align-items:center;padding:2px 8px;overflow-x:auto;max-width:100vw}#tray button{display:flex;align-items:center;gap:2px;border:0;border-radius:10px;background:var(--card);color:var(--fg);padding:2px 6px;font:inherit}
#ad{display:flex;gap:6px;justify-content:center}#ai{width:120px;font:inherit;padding:6px;border-radius:10px;border:1px solid var(--ac);background:var(--card);color:var(--fg)}#ab{font:inherit;border:0;border-radius:10px;background:var(--ac);color:#fff;padding:6px 12px}
.ic{width:1em;height:1em;vertical-align:-.15em}#mk .ic{width:24px;height:24px}#co .ic,#co2 .ic{color:#ffc933;width:1.1em;height:1.1em}
.g{grid-template-columns:repeat(2,1fr)}.it img{width:84px;height:84px}.it small{font-size:12px}
#tb{align-items:center}#tb .bk{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:14px;padding:8px 12px}.ht{font-size:18px;margin-left:8px}
.hh{margin:14px 0 6px;font-weight:700;opacity:.8}.hg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:104px;border:0;border-radius:18px;color:#fff;font:inherit;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}.tl .ic{width:46px;height:46px}
.cc{margin-bottom:8px}.cc .cs{margin-bottom:4px}.mr{display:flex;gap:6px}.mr button{flex:1;font:inherit;font-size:12px;padding:6px;border:0;border-radius:10px;background:var(--card);color:var(--fg)}
.sm{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px}.sm .sl{flex:0 0 64px;margin:0}.sm .sl img{width:48px;height:48px}.sm .sl span{font-size:30px;line-height:48px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}#rs{animation:pop .4s}
#vp{height:132px;padding:0}#st{align-items:center;height:100%}#vp:before,#vp:after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none}#vp:before{left:0;background:linear-gradient(90deg,var(--card),transparent)}#vp:after{right:0;background:linear-gradient(-90deg,var(--card),transparent)}#vp i{box-shadow:0 0 12px #ff2d55;z-index:3}
#dl{position:relative;width:260px;height:260px;margin:10px auto}#dl svg{position:absolute;inset:0;transition:filter .4s}#dl .dt{position:absolute;left:75px;top:75px;width:110px;height:110px}#dp{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-size:18px;text-shadow:0 1px 4px #000a;color:#fff}#pt{position:absolute;inset:0}#pt i{position:absolute;left:50%;top:6px;margin-left:-9px;border:9px solid transparent;border-top:20px solid #fff;filter:drop-shadow(0 0 6px #fff)}#dl.ok svg{filter:drop-shadow(0 0 16px #2fd27c)}#dl.no svg{filter:drop-shadow(0 0 16px #ff4d6d)}
#ov #go{font-size:20px;background:var(--ac)}
.g3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g3 div{background:var(--card);border-radius:10px;padding:6px 2px;text-align:center;font-size:10px}.g3 img{width:44px;height:44px}.g3 span{font-size:30px;line-height:44px;display:block}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.cb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--card);overflow:hidden}.cb img{width:100%}.cb .sl{margin:0;flex:none;width:100%}.cb .sl small{display:none}.cb .sl img{width:100%;height:auto}.cb .sl span{font-size:26px;line-height:48px}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}.cb.sh{animation:shk .25s infinite}.cb.rv{animation:pop .45s;box-shadow:0 0 14px #ffd23f}
.cp{text-align:center}.cp img{width:170px}
#co{font-weight:700}#mk{font-size:20px;border:0;background:var(--card);border-radius:10px;padding:4px 8px}
</style></head><body>
